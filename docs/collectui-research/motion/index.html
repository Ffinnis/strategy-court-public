*{box-sizing:border-box}body{margin:0;background:#fff;color:#191919;font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,a,input{font:inherit}a{color:inherit;text-underline-offset:4px}button{cursor:pointer}header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid #eee;gap:24px}header strong{white-space:nowrap;font-size:14px;font-weight:600}nav{display:flex;gap:5px}nav button{white-space:nowrap;border:0;border-radius:7px;color:#777;background:transparent;padding:8px 12px}nav button[aria-selected=true]{color:#181818;background:#f1f1f1}main{display:grid;grid-template-columns:minmax(540px,1fr) 420px;max-width:1400px;margin:auto;min-height:650px}.stage{position:relative;overflow:hidden;height:646px;background:white}.stage video{position:absolute;height:var(--media-height);width:auto;max-width:none;left:50%;top:50%;transform:translate(-50%,-50%)}.stage img{width:100%;height:100%;object-fit:contain}aside{padding:32px 36px 20px 18px}aside .eyebrow{font-size:12px;color:#767676;margin:0 0 8px}h1{font-size:30px;line-height:1.15;letter-spacing:-.8px;font-weight:600;margin:0 0 13px}.lead{font-size:16px;line-height:1.5;color:#626262;margin:0 0 20px}.point{margin:0 0 13px}.point strong{font-size:13px;font-weight:600}.point p{font-size:12px;line-height:1.5;color:#6d6d6d;margin:3px 0 0}.application{border-top:1px solid #e9e9e9;padding-top:15px;margin-top:18px}.application p{color:#333;font-size:12px;margin:5px 0}.source{display:flex;gap:15px;margin-top:15px;font-size:12px}.controls{display:flex;gap:8px;align-items:center;margin-top:17px}.controls button{border:1px solid #e4e4e4;background:#fff;color:#444;padding:5px 10px;border-radius:6px;font-size:12px}.controls span{font-size:11px;color:#858585}.controls input{width:64px;padding:4px 6px;border:1px solid #e4e4e4;border-radius:6px;font-size:12px}footer{border-top:1px solid #eee;padding:13px 32px;display:flex;justify-content:space-between;gap:20px;font-size:11px;color:#7c7c7c}footer a{color:#555}.error{position:absolute;inset:0;display:grid;place-items:center;padding:40px}.note{font-size:11px;color:#7b7b7b}.avoid{margin-top:10px}body[data-focus=true] main{display:block;max-width:100%}body[data-focus=true] aside{display:none}body[data-focus=true] header{height:50px}body[data-focus=true] .stage{height:calc(100vh - 91px)}body[data-focus=true] footer{padding:10px 32px}body[data-focus=true] nav button{font-size:12px;padding:5px 10px}
@media(max-width:850px){header{padding:12px 18px;height:auto;align-items:flex-start;flex-direction:column;gap:9px}nav{flex-wrap:wrap}nav button{padding:6px 8px;font-size:12px}main{display:flex;flex-direction:column;min-height:0}.stage{height:520px}.stage video{height:calc(var(--media-height) * .73)}aside{padding:22px 24px 30px}footer{padding:15px 24px;flex-direction:column;gap:7px}body[data-focus=true] header{height:auto}body[data-focus=true] .stage{height:580px}}

<footer><span>Original videos credited to their creators on CollectUI. Enlarged for inspection. Research references, not app mockups.</span><a href="README.md">Read the motion brief</a></footer>
<script>
const references=[{"id": "01-tabs", "label": "Tabs", "name": "Tactile tabs", "author": "Marcel", "height": 820, "background": "#0b0b0b", "priority": "Use first", "lead": "Softly raised buttons with a precise moving selection marker.", "craft": [["Look", "A fine rim and slight inset shading give each tab a physical edge. The selected label becomes clearer without changing size."], ["Motion", "The short active marker travels along a shared baseline. The button and marker read as one selection."], ["Use in Strategy Court", "Apply this to the Court, Evidence, Trades, and Audit navigation. Keep content stable while the indicator moves."]], "application": "Keep a compact button profile and a solid active marker. Prototype a 160 to 200 ms transition, with no bounce. These are proposed timings, not measured source values.", "avoid": "The source includes a light halo. Omit that halo in the current app direction. Use semantic tabs, keyboard navigation, and a separate visible focus ring.", "url": "https://collectui.com/designs/tabs-ui-design-inspiration/38080c55-3c72-426c-bfe2-5d690d24a4fc", "source": "https://x.com/marcelkargul/status/2089632076370763821", "video": "https://cdn.collectui.com/amplify_video/2089632023019220992/vid/avc1/2400x2160/LBa0ZxSO4Y3YHd9q-optimized.mp4", "fallback": "screenshots/01-tabs-source.jpg"}, {"id": "02-expanding-list", "label": "List", "name": "An expanding list with an inset switch", "author": "Jeet", "height": 800, "background": "#fff", "priority": "Use first", "lead": "A small pale panel, a recessed mode switch, and a reveal of additional rows.", "craft": [["Look", "The hierarchy comes from spacing, a soft outer edge, and aligned labels. There is no separate card around each item."], ["Motion", "The panel changes height as rows are revealed. A white thumb moves inside the footer switch as the list mode changes."], ["Use in Strategy Court", "Use this for extra test results, strategy parameters, or an expanded list of warnings within a run inspector."]], "application": "Preserve the first visible row and the user\u2019s focus. Start with a 200 to 260 ms height transition and a shorter row fade. The main page should stay flat.", "avoid": "Do not hide severe findings behind this disclosure. Extra content needs an explicit button, an item count, and correct expanded state.", "url": "https://collectui.com/designs/list-items-ui-design-inspiration/8b22f858-287f-4796-915b-42c69b8963f3", "source": "https://x.com/jeetnirnejak/status/2048024404102467781", "video": "https://cdn.collectui.com/amplify_video/2048024337664606208/vid/avc1/1878x1458/NIkwUYyYYUDLh2pX-optimized.mp4", "fallback": "screenshots/02-expanding-list-source.jpg"}, {"id": "03-toast-stack", "label": "Notifications", "name": "Notifications with depth", "author": "Benji Taylor", "height": 780, "background": "#000", "priority": "Use first", "lead": "One crisp front notification, with older notifications receding into a shallow stack.", "craft": [["Look", "Scale, overlap, and restrained shading establish depth. The front message has the strongest contrast and the cleanest outline."], ["Motion", "New messages move into the front position while the stack rearranges behind them."], ["Use in Strategy Court", "Use for report exports, copied evidence links, saved parameters, and completed background runs."]], "application": "Keep the newest message readable and offer an action such as Open report. Use one stable screen corner and cap the visible stack at three. Keep a persistent activity history.", "avoid": "Do not bury failures in a fading stack. Announce updates accessibly, pause dismissal while focused or hovered, and never use toasts as the only error record.", "url": "https://collectui.com/designs/notification-ui-design-inspiration/2efe178b-f7dc-4e01-bef0-12fd41a31909", "source": "https://x.com/benjitaylor/status/2069168413306667353", "video": "https://cdn.collectui.com/amplify_video/2069102963746877440/vid/avc1/1920x1080/LWJoAH32j8NRJxH9-optimized.mp4", "fallback": "screenshots/03-toast-stack-source.jpg"}, {"id": "04-morphing-create", "label": "Create menu", "name": "A button becomes its menu", "author": "Lorenzo Cabra", "height": 1040, "background": "#fafaf8", "priority": "Prototype", "lead": "The original black pill expands into a menu, making the origin of the new controls unmistakable.", "craft": [["Look", "The trigger and menu share the same fill and visual identity. Icons and labels sit inside one shape."], ["Motion", "The boundary expands as menu content appears. The source uses an expressive spring and a pronounced rounded intermediate shape."], ["Use in Strategy Court", "Try this on a secondary Create action with choices such as a new case, an import, or a duplicated setup."]], "application": "Prototype with a smaller overshoot and 220 to 280 ms of motion. Reserve the effect for one distinct action, not every dropdown in the app.", "avoid": "Do not delay activation until animation ends. Preserve menu keyboard behavior, Escape dismissal, outside-click dismissal, and focus return. Leave sound off.", "url": "https://collectui.com/designs/dropdown-ui-design-inspiration/f6ea1705-2356-410a-b075-89cef5384d21", "source": "https://x.com/cabralorenzo/status/2090879486074008046", "video": "https://cdn.collectui.com/amplify_video/2090878776737501184/vid/avc1/1012x962/5hSRHdKlj7PrGhcd-optimized.mp4", "fallback": "screenshots/04-morphing-create-source.jpg"}, {"id": "05-tick-dial", "label": "Dial", "name": "A dial made from fine ticks", "author": "Lorenzo Cabra", "height": 1010, "background": "#fafaf8", "priority": "Prototype", "lead": "Evenly spaced radial marks create a precise instrument around one readable value.", "craft": [["Look", "The value sits at the visual center. Active ticks form a clear arc, while inactive ticks fade into the background."], ["Motion", "The active arc responds to value changes. Its many small marks make each change visible without adding another chart."], ["Use in Strategy Court", "Explore it for one bounded setting such as test coverage or a resampling budget in advanced run setup."]], "application": "Pair the dial with a numeric input, clear units, and explicit limits. The dial can be a distinctive accent in setup while tables retain ordinary controls.", "avoid": "Do not turn the strategy verdict into a decorative gauge or imply extra precision. Provide keyboard steps and a linear control alternative.", "url": "https://collectui.com/designs/range-slider-ui-design-inspiration/9db4fdea-16a2-465c-9637-90b8ee6e65fd", "source": "https://x.com/cabralorenzo/status/2090102237548740718", "video": "https://cdn.collectui.com/amplify_video/2089800986999050240/vid/avc1/1042x1004/EtJ8jme-ZQ8aoDWP-optimized.mp4", "fallback": "screenshots/05-tick-dial-source.jpg"}, {"id": "06-pixel-ripple", "label": "Ripple button", "name": "A ripple through tiny cells", "author": "Raul", "height": 920, "background": "#fff", "priority": "Optional accent", "lead": "A field of small squares gives a simple button a more distinctive hover response.", "craft": [["Look", "The label remains a single clean layer above the cell texture. The grid has the same appeal as the approved dense matrix reference."], ["Motion", "A localized change travels through the small cells around the pointer. The effect stays inside the button."], ["Use in Strategy Court", "Try a restrained version on the first-run onboarding action or a replay control. Keep repeated table actions quiet."]], "application": "Use low-contrast monochrome cells or one existing accent. Keep the label sharp and activate immediately. Run the effect only while the control is engaged.", "avoid": "The source\u2019s blue glow is not part of the recommendation. Avoid continuous waves, color cycling, extra GPU work across many buttons, and motion under small text.", "url": "https://collectui.com/designs/button-ui-design-inspiration/5582e784-9066-4c33-9af4-8bf144ca9e14", "source": "https://x.com/raul_dronca/status/2093270659824529461", "video": "https://cdn.collectui.com/amplify_video/2093270525929820160/vid/avc1/2876x2160/VDp048V6SVGHnDap-optimized.mp4", "fallback": "screenshots/06-pixel-ripple-source.jpg"}];
const nav=document.querySelector('nav'),stage=document.querySelector('.stage'),aside=document.querySelector('aside');
const params=new URLSearchParams(location.search);document.body.dataset.focus=params.get('focus')==='1';
references.forEach((r,i)=>{const b=document.createElement('button');b.textContent=r.label;b.onclick=()=>show(i);nav.append(b)});
function show(i){const r=references[i];document.querySelectorAll('nav button').forEach((b,j)=>b.setAttribute('aria-selected',String(i===j)));stage.style.setProperty('--media-height',r.height+'px');stage.style.background=r.background;stage.replaceChildren();const v=document.createElement('video');v.src=r.video;v.muted=true;v.loop=true;v.playsInline=true;v.preload='auto';v.autoplay=!matchMedia('(prefers-reduced-motion: reduce)').matches;v.setAttribute('aria-label',r.name+' original video by '+r.author);stage.append(v);v.onerror=()=>{stage.innerHTML=`<img src="${r.fallback}" alt="Original CollectUI browser screenshot"><div class="error"><p>Video unavailable. <a href="${r.url}" target="_blank" rel="noreferrer">Open the original on CollectUI</a>.</p></div>`};aside.innerHTML=`<p class="eyebrow">${r.author} · ${r.priority} · ${i+1} of ${references.length}</p><h1>${r.name}</h1><p class="lead">${r.lead}</p>${r.craft.map(([title,text])=>`<div class="point"><strong>${title}</strong><p>${text}</p></div>`).join('')}<div class="application"><strong>How I would implement it</strong><p>${r.application}</p><p class="note avoid">${r.avoid}</p></div><div class="source"><a href="${r.url}" target="_blank" rel="noreferrer">CollectUI source ↗</a><a href="${r.source}" target="_blank" rel="noreferrer">Designer’s post ↗</a></div><div class="controls"><button id="pause">${v.autoplay?'Pause':'Play'}</button><button id="restart">Restart</button><button id="frame">Full frame</button><input id="scrub" type="number" min="0" max="100" step="0.1" value="0" aria-label="Playback time in seconds"><span id="clock">0s</span></div>`;document.querySelector('#pause').onclick=()=>{if(v.paused)v.play();else v.pause()};v.onpause=()=>document.querySelector('#pause').textContent='Play';v.onplay=()=>document.querySelector('#pause').textContent='Pause';document.querySelector('#restart').onclick=()=>{v.currentTime=0;v.play()};document.querySelector('#frame').onclick=()=>{const fit=v.style.objectFit==='contain';v.style.height=fit?'':'100%';v.style.width=fit?'':'100%';v.style.objectFit=fit?'':'contain';document.querySelector('#frame').textContent=fit?'Full frame':'Detail view'};const scrub=document.querySelector('#scrub');v.onloadedmetadata=()=>scrub.max=v.duration;v.ontimeupdate=()=>{scrub.value=v.currentTime;document.querySelector('#clock').textContent=Math.floor(v.currentTime)+'s'};scrub.oninput=()=>{v.currentTime=Math.max(0,Math.min(v.duration||0,Number(scrub.value)||0));v.pause()};history.replaceState(null,'','?ref='+i+(params.get('focus')==='1'?'&focus=1':''));}
show(Math.min(references.length-1,Math.max(0,Number(params.get('ref'))||0)));
</script></html>
